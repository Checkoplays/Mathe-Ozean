<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087da3"><link rel="manifest" href="manifest.webmanifest"><title>Mathe-Ozean</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#087da3;color:#fff}.app{max-width:520px;min-height:100dvh;margin:auto;background:linear-gradient(#16b5d1,#06618d);padding:20px 18px 35px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:5px 0}.pill{background:#ffffff35;border-radius:30px;padding:9px 14px;font-weight:700}.sea{height:230px;position:relative;overflow:hidden;border-radius:25px;background:linear-gradient(#48d9e8,#07629b);margin:20px 0;border:3px solid #ffffff70}.sea:after{content:'🪸 🪨 🌿 🪸';position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:35px}.fish{position:absolute;font-size:40px;animation:swim 8s ease-in-out infinite alternate;left:var(--x);top:var(--y);animation-delay:var(--delay)}@keyframes swim{from{transform:translateX(-15px) rotate(-5deg)}to{transform:translateX(45px) rotate(5deg)}}.bubble{position:absolute;border:2px solid #ffffff70;border-radius:50%;width:14px;height:14px;left:20%;bottom:0;animation:rise 5s infinite}@keyframes rise{to{transform:translateY(-230px);opacity:0}}.panel{background:#fff;color:#153d58;border-radius:26px;padding:24px 18px;text-align:center;box-shadow:0 8px 20px #003c6544}.sub{color:#49738a;font-weight:650}.question{font-size:44px;font-weight:850;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{border:0;border-radius:17px;padding:18px;font-size:29px;font-weight:800;color:#075c82;background:#dff7ff;cursor:pointer;min-height:75px}.answers button:active{transform:scale(.97)}.feedback{min-height:30px;font-weight:800;margin-top:15px}.controls{display:flex;gap:10px;margin-top:17px}.controls button,.controls select{border:1px solid #ffffff88;border-radius:12px;background:#ffffff2b;color:white;padding:12px;font-size:15px;flex:1;min-width:0}.controls select option{color:#123}footer{text-align:center;font-size:12px;opacity:.8;margin-top:15px}</style></head><body><main class="app"><header><h1>🐠 Mathe-Ozean</h1><span class="pill" id="score">⭐ 0</span></header><div class="sea" id="sea"><div class="bubble"></div><div class="bubble" style="left:75%;animation-delay:2s"></div></div><section class="panel"><div class="sub" id="levelLabel">Plusrechnen bis 10</div><div class="question" id="question">3 + 4 = ?</div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="controls"><select id="mode" aria-label="Schwierigkeitsgrad"><option value="plus10">Plus bis 10</option><option value="minus10">Minus bis 10</option><option value="plus20">Plus bis 20</option><option value="minus20">Minus bis 20</option><option value="mix20">Gemischt bis 20</option></select><button id="reset">Neustart</button></div><footer>Ohne Werbung · Offline nutzbar · Fortschritt auf diesem Gerät</footer></main><script>const $=id=>document.getElementById(id);let score=Number(localStorage.getItem('oceanScore')||0),mode=localStorage.getItem('oceanMode')||'plus10',correct=0,locked=false;const rnd=n=>Math.floor(Math.random()*(n+1));$('mode').value=mode;function drawSea(){$('score').textContent='⭐ '+score;$('sea').querySelectorAll('.fish').forEach(x=>x.remove());const creatures=['🐟','🐠','🐡','🐢','🐬','🦀','🪼','🐙','🦈','🐳'];let count=Math.min(1+Math.floor(score/5),18);for(let i=0;i<count;i++){let e=document.createElement('span');e.className='fish';e.textContent=creatures[i%creatures.length];e.style.setProperty('--x',((i*37+7)%75)+'%');e.style.setProperty('--y',((i*41+12)%68)+'%');e.style.setProperty('--delay',(-i*0.8)+'s');$('sea').append(e)}}function task(){locked=false;$('feedback').textContent='';let max=mode.endsWith('10')?10:20,minus=mode.startsWith('minus')||(mode==='mix20'&&Math.random()<.5),a,b;if(minus){a=rnd(max);b=rnd(a);correct=a-b}else{correct=rnd(max);a=rnd(correct);b=correct-a}$('question').textContent=`${a} ${minus?'−':'+'} ${b} = ?`;$('levelLabel').textContent=({plus10:'Plusrechnen bis 10',minus10:'Minusrechnen bis 10',plus20:'Plusrechnen bis 20',minus20:'Minusrechnen bis 20',mix20:'Plus und Minus bis 20'})[mode];let choices=new Set([correct]);while(choices.size<4)choices.add(rnd(max));let arr=[...choices].sort(()=>Math.random()-.5);$('answers').replaceChildren();for(let n of arr){let btn=document.createElement('button');btn.textContent=n;btn.onclick=()=>{if(locked)return;if(n===correct){locked=true;score++;localStorage.setItem('oceanScore',score);$('feedback').textContent=score%5===0?'🎉 Ein neuer Meeresbewohner!':'Super gerechnet! ⭐';drawSea();setTimeout(task,1100)}else{$('feedback').textContent='Fast! Versuch es noch einmal.';btn.style.background='#ffe2e2'}};$('answers').append(btn)}}$('mode').onchange=e=>{mode=e.target.value;localStorage.setItem('oceanMode',mode);task()};$('reset').onclick=()=>{if(confirm('Alle gesammelten Sterne und Tiere zurücksetzen?')){score=0;localStorage.setItem('oceanScore',0);drawSea();task()}};drawSea();task();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#036f9c"><link rel="manifest" href="manifest.webmanifest"><title>Mathe-Ozean 4 · 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#003655;color:white;font-family:system-ui,sans-serif}.app{max-width:620px;margin:auto;padding:10px;min-height:100dvh;background:linear-gradient(#067caa,#003b6c)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:4px 0}button,select{font:inherit;cursor:pointer}.pill{border:1px solid #ffffff70;background:#ffffff25;color:white;border-radius:30px;padding:8px 12px}.barrow{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin:8px 0 5px}.track{height:14px;background:#00416d;border:1px solid #ffffff80;border-radius:30px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ffdd55,#ff8b36);width:0%;transition:width .35s}.sea{height:clamp(340px,52dvh,650px);border-radius:22px;overflow:hidden;position:relative;border:2px solid #9deaff;margin-top:9px;background:linear-gradient(#25bfdc,#034674)}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:#fff1b7;color:#684300;padding:12px;border-radius:18px;font-weight:900;max-width:90%;text-align:center;pointer-events:none}.hidden{display:none}.panel{background:white;color:#134767;text-align:center;padding:9px 12px;border-radius:20px;margin-top:9px}.mode{font-size:12px;font-weight:800;color:#52758a}.question{font-size:35px;font-weight:900;margin:2px 0 8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:7px}.answers button{background:#d8f6ff;border:2px solid #80c8dd;border-radius:14px;font-size:26px;font-weight:900;color:#075679;min-height:49px}.answers button:disabled{opacity:.65}.feedback{font-size:12px;min-height:18px;margin-top:5px}.controls{display:flex;gap:7px;margin-top:8px}.controls>*{min-width:0;border-radius:12px;background:#ffffff24;border:1px solid #ffffff80;color:white;padding:9px;flex:1}.controls option{color:#123}.controls button{flex:0 0 auto}footer{text-align:center;font-size:11px;opacity:.8;margin-top:8px}@media(max-height:750px){.sea{height:43dvh;min-height:270px}.question{font-size:30px}.answers button{min-height:43px}} </style></head><body><main class="app"><header><h1>🐙 Mathe-Ozean 3D</h1><button class="pill" id="sound">🔊</button><span class="pill" id="score">⭐ 0</span></header><div class="barrow"><span id="progressText">Noch 5 Aufgaben bis zur Überraschung</span><span id="progressCount">0 / 5</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="sea" id="sea"><div class="toast hidden" id="toast"></div></div><section class="panel"><div class="mode" id="modeLabel">Plus bis 10</div><div class="question" id="question">3 + 4 = ?</div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="controls"><select id="mode"><option value="plus10">Plus bis 10</option><option value="minus10">Minus bis 10</option><option value="plus20">Plus bis 20</option><option value="minus20">Minus bis 20</option><option value="mix20">Gemischt bis 20</option></select><button id="party">🎉 Party!</button><button id="reset">↻</button></div><footer>Version 4.0 · Echte WebGL-3D-Modelle · Offline nach Erstladung</footer></main><script type="module" src="./game3d.js"></script></body></html>
